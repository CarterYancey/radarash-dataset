[project]
name = "radarash-dataset"
version = "0.1.0"
description = "Point-in-time, survivorship-bias-free dataset construction from Sharadar data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.scripts]
sharadar-ingest = "ingest.download:main"
sharadar-identity = "identity.cli:main"
sharadar-labels = "labels.cli:main"
sharadar-features = "features.cli:main"
sharadar-splits = "splits.cli:main"
sharadar-assemble = "assemble.cli:main"
sharadar-inference = "inference.cli:main"
sharadar-qa = "qa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Packages live directly under src/ (src/ingest, src/identity, ...) per the
# architecture in README.md. Add new top-level packages here as they appear.
packages = ["src/ingest", "src/identity", "src/labels", "src/features", "src/splits", "src/assemble", "src/inference", "src/qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
