[project]
name = "radarash-dataset"
version = "0.1.0"
description = "Point-in-time, survivorship-bias-free dataset construction from Sharadar data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.32",
]

[project.scripts]
sharadar-ingest = "ingest.download:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Packages live directly under src/ (src/ingest, src/identity, ...) per the
# architecture in README §8. Add new top-level packages here as they appear.
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
